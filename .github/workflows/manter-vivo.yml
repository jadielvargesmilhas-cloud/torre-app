name: Manter os agendamentos vivos

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gravar a batida
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%d %H:%M UTC' > .github/ultima-batida.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima-batida.txt
          git commit --allow-empty -m "Batida semanal: mantem os agendamentos ativos"
          git push
